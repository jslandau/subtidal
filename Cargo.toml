[package]
name = "subtidal"
version = "0.2.2"
edition = "2021"
description = "Real-time speech-to-text overlay for Linux/Wayland"
license = "MIT"

[lib]
name = "subtidal"
path = "src/lib.rs"

[[bin]]
name = "subtidal"
path = "src/main.rs"

[dependencies]
# Audio
rubato = "1.0"
ringbuf = "0.4"
bytemuck = "1"
audioadapter-buffers = "2"

# STT (ort + parakeet-rs are Linux-only; see target-conditional block below)
ndarray = "0.16"

# Config hot-reload
notify = "6"
notify-debouncer-mini = "0.4"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Time and date handling
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }

# Error handling
anyhow = "1"

# Async runtime (required by hf-hub)
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs"] }

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# XDG directory resolution
dirs = "5"

# Signal handling
ctrlc = "3"

# Lock-free atomic swap for engine selection
arc-swap = "1"

# Async channels for glib main-loop consumption
async-channel = "2"

# Model management (cross-platform)
hf-hub = { version = "0.5", features = ["tokio"] }

# Linux-only crates and CUDA feature additions.
# Resolver v2 (edition 2021 default) isolates the `cuda` feature on `ort` and
# `parakeet-rs` to Linux-target compilations only; on non-Linux targets these
# entries are skipped entirely and the base `[dependencies]` versions (without
# `cuda`) are used. Version strings MUST match the base entries — Cargo rejects
# target-conditional entries that omit version.
[target.'cfg(target_os = "linux")'.dependencies]
# GUI
gtk4 = { version = "0.10", features = ["v4_10"] }
gtk4-layer-shell = "0.7"
glib = "0.19"
# System tray
ksni = "0.3"
# Audio
pipewire = "0.9"
# STT (ort + parakeet-rs are Linux-only — they drag onig_sys/cc-bound C deps
# that don't cross-compile from Linux to darwin).
ort = { version = "2.0.0-rc.12", features = ["cuda"] }
parakeet-rs = { version = "0.3.4", features = ["cuda"] }
# Desktop notifications (notify-rust pulls in mac-notification-sys whose build
# script fails when cross-compiling from Linux to darwin).
notify-rust = "4"
# Process exit without atexit handlers (avoids CUDA cleanup race)
libc = "0.2"

# Resolver v2 isolates the `webgpu` feature on `ort` and `parakeet-rs` to
# macOS-target compilations only; this mirrors the Linux/cuda pattern above.
[target.'cfg(target_os = "macos")'.dependencies]
parakeet-rs = { version = "0.3.4", features = ["webgpu"] }
ort = { version = "2.0.0-rc.12", features = ["webgpu"] }
hound = "3.5"  # WAV reader for the spike fixture; tiny pure-Rust crate
# AppKit bindings (used Phase 2+); declared up-front so cross-target check exercises them.
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSString", "NSNotification", "NSObject", "NSRunLoop",
] }
objc2-app-kit = { version = "0.3", features = [
    "NSApplication", "NSPanel", "NSWindow", "NSTextField", "NSScreen",
    "NSColor", "NSFont", "NSAttributedString", "NSEvent",
    "NSResponder", "NSView", "NSAppearance",
] }
objc2-core-foundation = "0.3"
# Grand Central Dispatch for caption-bridge main-thread marshaling (Phase 2+).
dispatch2 = "0.3"
block2 = "0.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[dev-dependencies]
tempfile = "3"
