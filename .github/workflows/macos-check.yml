name: macOS target check

# Runs on macos-latest (Apple Silicon) rather than ubuntu-latest because
# several C-build-script dependencies (ring, onig_sys, possibly others
# pulled in via hf-hub / tokenizers / parakeet-rs) invoke `cc` with
# darwin-specific flags (-arch x86_64, -mmacosx-version-min, -gfull) that
# Linux's plain `cc` does not understand. macOS's native cc handles them,
# and `cargo check --target x86_64-apple-darwin` from an aarch64 host is
# still cross-compilation — it still flags any Linux-coupling regression
# in cfg-gated modules. Phase 7 adds an aarch64-apple-darwin matrix entry.

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - run: cargo check --lib --target x86_64-apple-darwin --verbose
